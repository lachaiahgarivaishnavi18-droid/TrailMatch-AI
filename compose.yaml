services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://trialmatch:local-development-only@db:5432/trialmatch
      EMBEDDING_PROVIDER: local
      LLM_PROVIDER: none
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: trialmatch
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: trialmatch
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trialmatch"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
